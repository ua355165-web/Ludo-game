name: Ludo Royale Android Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Android artifacts
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
      RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate Android app module
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts -o -f settings.gradle
          test -f app/build.gradle.kts -o -f app/build.gradle
          test -f gradlew
          test -x gradlew || chmod +x gradlew
          grep -q 'include(":app")' settings.gradle.kts || grep -q "include ':app'" settings.gradle

      - name: Configure Firebase from secret
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "GOOGLE_SERVICES_JSON is not configured. Debug build may run, but production Firebase/online validation requires this secret."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          python3 - <<'PY'
          import json
          with open('app/google-services.json', encoding='utf-8') as f:
              data = json.load(f)
          for key in ('project_info', 'client'):
              if key not in data:
                  raise SystemExit(f'Invalid GOOGLE_SERVICES_JSON: missing {key}')
          print('Firebase configuration JSON is valid.')
          PY

      - name: Configure release signing when all secrets exist
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "release_signing=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are incomplete. Debug APK will still be built; release APK/AAB will be skipped."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          test -s release.keystore
          echo "release_signing=true" >> "$GITHUB_OUTPUT"

      - name: Build and test debug APK
        run: ./gradlew --no-daemon test assembleDebug

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.release_signing == 'true'
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Explain skipped release outputs
        if: steps.signing.outputs.release_signing != 'true'
        run: echo "Release APK/AAB were intentionally not generated because signing secrets were unavailable."

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ludo-royale-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        if: steps.signing.outputs.release_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ludo-royale-release-apk
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

      - name: Upload signed release AAB
        if: steps.signing.outputs.release_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ludo-royale-release-aab
          if-no-files-found: error
          path: app/build/outputs/bundle/release/*.aab
